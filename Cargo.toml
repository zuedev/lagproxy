[package]
name = "lagproxy"
version = "0.1.0"
edition = "2021"
description = "A command line proxy that makes the network worse on purpose"
license = "Unlicense"
repository = "https://github.com/zuedev/lagproxy"
readme = "README.md"
keywords = ["network", "latency", "proxy", "netcode", "testing"]
categories = ["command-line-utilities", "network-programming", "simulation"]

[dependencies]
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ctrlc = "3"
ratatui = "0.29"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "rayon"] }

[[bench]]
name = "lagproxy"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
