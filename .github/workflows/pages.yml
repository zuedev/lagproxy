name: pages

on:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Render README to HTML
        run: |
          mkdir -p site
          pandoc README.md \
            --from gfm \
            --to html5 \
            --standalone \
            --metadata title=lagproxy \
            --css style.css \
            --output site/index.html
          cat > site/style.css <<'CSS'
          body {
            max-width: 46rem;
            margin: 2rem auto;
            padding: 0 1rem;
            font: 16px/1.6 system-ui, sans-serif;
            color: #24292f;
          }
          h1.title { margin-bottom: 2rem; }
          pre, code { background: #f6f8fa; border-radius: 6px; }
          pre { padding: 1rem; overflow-x: auto; }
          code { padding: 0.15em 0.35em; }
          pre code { padding: 0; }
          table { border-collapse: collapse; width: 100%; }
          th, td { border: 1px solid #d0d7de; padding: 0.4rem 0.6rem; text-align: left; }
          blockquote { margin: 0; padding-left: 1rem; border-left: 4px solid #d0d7de; color: #57606a; }
          a { color: #0969da; }
          @media (prefers-color-scheme: dark) {
            body { background: #0d1117; color: #e6edf3; }
            pre, code { background: #161b22; }
            th, td, blockquote { border-color: #30363d; }
            a { color: #4493f8; }
          }
          CSS

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
